<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c36c"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9a7b38"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Accent -->
  <circle cx="120" cy="120" r="114" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Subtle Internal Grid Pattern for Consulting/Tech aesthetic -->
  <circle cx="120" cy="120" r="98" fill="none" stroke="#233554" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="120" r="82" fill="none" stroke="#233554" stroke-width="1"/>

  <!-- Geometric Node Connectors (Process / Systems symbolism) -->
  <circle cx="120" cy="22" r="4" fill="#c5a059"/>
  <circle cx="120" cy="218" r="4" fill="#c5a059"/>
  <circle cx="22" cy="120" r="4" fill="#c5a059"/>
  <circle cx="218" cy="120" r="4" fill="#c5a059"/>

  <!-- Monogram Initials "ABV" -->
  <g transform="translate(120, 115)" text-anchor="middle" dominant-baseline="central">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="4" 
          fill="url(#goldGrad)">ABV</text>
  </g>

  <!-- Subtitle Badge -->
  <g transform="translate(120, 160)" text-anchor="middle">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#112240" stroke="#c5a059" stroke-width="1.2"/>
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="1.2" 
          fill="#e6f1ff">ERP CONSULTANT</text>
  </g>
</svg>
