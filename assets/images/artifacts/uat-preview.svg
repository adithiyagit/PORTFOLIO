    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0f172a">INV-058</text>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Inventory: Inter-Store Stock Transit Discrepancy</text>
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Branch A transfers 100g, Branch B accepts 98.5g (Transit damage)</text>
    <text x="410" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">Transit loss variance ledger automatically debited</text>
    <rect x="595" y="14" width="60" height="22" rx="4" fill="#fef3c7"/>
    <text x="625" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">HIGH</text>
