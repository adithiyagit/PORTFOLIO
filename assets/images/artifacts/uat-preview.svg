  <g transform="translate(30, 180)">
    <rect width="740" height="52" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0f172a">POS-024</text>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1e293b">POS: Dual Payment (Split Cash &amp; Card)</text>
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Partial cash payment + remaining amount swiped on EDC terminal</text>
    <text x="410" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">Accurate invoice split; dual ledger posting</text>
    <rect x="595" y="14" width="60" height="22" rx="4" fill="#fee2e2"/>
    <text x="625" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">CRITICAL</text>
