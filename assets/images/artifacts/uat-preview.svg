<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3e62"/>
    </linearGradient>
  </defs>

  <!-- Document Canvas -->
  <rect width="800" height="500" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <path d="M 0 8 Q 0 0 8 0 L 792 0 Q 800 0 800 8 L 800 70 L 0 70 Z" fill="url(#headerGrad)"/>
  <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c5a059" letter-spacing="1">QUALITY ASSURANCE &amp; UAT EXECUTION</text>
  <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">User Acceptance Testing (UAT) Scenario &amp; Sign-off Log</text>
  <rect x="640" y="24" width="130" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="705" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">100% SIGNED OFF</text>

  <!-- Status Bar Summary -->
  <g transform="translate(30, 85)">
    <rect width="175" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Total Test Cases: <tspan font-weight="700" fill="#0f172a">164</tspan></text>

    <rect x="185" width="175" height="42" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="201" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#065f46">Passed: <tspan font-weight="700" fill="#047857">164 (100%)</tspan></text>

    <rect x="370" width="175" height="42" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="386" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#991b1b">Blockers Retested: <tspan font-weight="700" fill="#dc2626">12 (All Closed)</tspan></text>

    <rect x="555" width="185" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="571" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">Store Sign-offs: <tspan font-weight="700" fill="#0f172a">9/9 Branches</tspan></text>
  </g>

  <!-- Table Header -->
  <rect x="30" y="140" width="740" height="32" fill="#0f172a" rx="4"/>
  <text x="45" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c5a059">TC-ID</text>
  <text x="120" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c5a059">MODULE &amp; SCENARIO DESCRIPTION</text>
  <text x="440" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c5a059">EXPECTED RESULT</text>
  <text x="630" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c5a059">SEVERITY</text>
  <text x="715" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#c5a059">STATUS</text>

