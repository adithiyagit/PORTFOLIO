  <!-- Footer Signoff Banner -->
  <g transform="translate(30, 425)">
    <rect width="740" height="50" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#166534">FINAL CUTOVER VERIFICATION:</text>
    <text x="235" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#15803d">Executed &amp; Verified by Adithiya B Vinu • Approved by Central Finance &amp; Store Steering Committee</text>
  </g>
