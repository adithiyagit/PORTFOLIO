    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0f172a">ACC-012</text>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Accounts: Multi-Store Daily Bank Reconciliation</text>
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Daily closing cash batch vs. verified bank deposit slips across 9 outlets</text>
    <text x="410" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">Zero unexplained variance; automated batch sync</text>
    <rect x="595" y="14" width="60" height="22" rx="4" fill="#fee2e2"/>
    <text x="625" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">BLOCKER</text>
    <rect x="675" y="14" width="50" height="22" rx="4" fill="#dcfce7"/>
    <text x="700" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">PASSED</text>
  </g>

  <!-- TC Row 4 -->
  <g transform="translate(30, 360)">
    <rect width="740" height="52" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0f172a">SEC-005</text>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#1e293b">Security: Negative Stock Prevention on Peak Sale Hours</text>
    <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">Simultaneous billing attempt of identical serialized jewellery SKU</text>
    <text x="410" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#334155">Immediate database row-lock; second cashier alerted</text>
    <rect x="595" y="14" width="60" height="22" rx="4" fill="#fee2e2"/>
    <text x="625" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">CRITICAL</text>
    <rect x="675" y="14" width="50" height="22" rx="4" fill="#dcfce7"/>
    <text x="700" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">PASSED</text>
