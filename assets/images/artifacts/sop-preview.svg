<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3e62"/>
    </linearGradient>
  </defs>

  <!-- Document Canvas -->
  <rect width="800" height="500" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Document Header Bar -->
  <path d="M 0 8 Q 0 0 8 0 L 792 0 Q 800 0 800 8 L 800 70 L 0 70 Z" fill="url(#headerGrad)"/>
  
  <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c5a059" letter-spacing="1">STANDARD OPERATING PROCEDURE</text>
  <text x="30" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">SOP-RET-04: Old Gold Exchange &amp; Scrap Inwarding Workflow</text>
  <rect x="650" y="24" width="120" height="26" rx="13" fill="#112240" stroke="#c5a059" stroke-width="1"/>
  <text x="710" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">VERIFIED v2.4</text>

  <!-- Metadata Table Strip -->
  <rect x="30" y="85" width="740" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="45" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b"><tspan font-weight="600" fill="#334155">Author:</tspan> Adithiya B Vinu (Functional Lead)</text>
  <text x="320" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b"><tspan font-weight="600" fill="#334155">Department:</tspan> Retail Showroom POS &amp; Audit</text>
  <text x="610" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b"><tspan font-weight="600" fill="#334155">Scope:</tspan> All 9 Branch Outlets</text>

  <!-- Step by Step Workflow Cards -->
  <!-- Step 1 -->
  <g transform="translate(30, 145)">
    <rect width="740" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#0a192f"/>
    <text x="35" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c5a059" text-anchor="middle">01</text>
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Physical Receipt &amp; Customer KYC Verification</text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#475569">Capture Customer ID (Aadhaar/PAN if &gt; ₹50k); generate Initial Receipt Token in Odoo CRM.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(30, 220)">
    <rect width="740" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#0a192f"/>
    <text x="35" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c5a059" text-anchor="middle">02</text>
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Karatmeter Purity Testing &amp; Gross/Net Weight Determination</text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#475569">Assay test certified purity (22K / 18K / 916); log gross weight, stone weight deduct, and net gold weight.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(30, 295)">
    <rect width="740" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#b45309"/>
    <text x="35" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#92400e">Governance Check: System Valuation &amp; Approval Matrix Validation</text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#78350f">Live gold board rate applied. Transactions &gt; ₹100,000 auto-trigger Store Manager 2FA sign-off in POS.</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(30, 370)">
    <rect width="740" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#0a192f"/>
    <text x="35" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#c5a059" text-anchor="middle">04</text>
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0f172a">Voucher Inwarding &amp; General Ledger Reconciliation</text>
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#475569">System generates Old Gold Credit Note; stock moves to Branch Scrap Holding Account; ready for purchase offset.</text>
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
    Standardized across 9 retail outlets • Zero manual calculation discrepancies • Full audit compliance
  </text>
</svg>
